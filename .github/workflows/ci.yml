name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # There is nothing to unit test here: the payload is upstream's, and what this
  # repository contributes is the assembly and the service around it. So the only
  # honest test is to build the package and install it on the operating system it
  # targets, which is what this does.
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 is native on the runner and is the fast signal.
          - arch: x86_64
          # aarch64 is what a router actually is. It needs QEMU here, and it is the
          # architecture the wheel bet is really about, so it is not optional.
          - arch: aarch64_generic
    steps:
      - uses: actions/checkout@v4

      # Without this the aarch64 rootfs dies with "exec /bin/sh: exec format error"
      # before a single byte is assembled.
      - uses: docker/setup-qemu-action@v3
        if: matrix.arch != 'x86_64'

      - name: build the package inside OpenWrt ${{ matrix.arch }}
        run: ./package/hermes-agent/build-in-container.sh ${{ matrix.arch }}

      # Architecture-independent, so one build serves every router; it is built here
      # rather than in its own job because both gates want both packages present.
      - name: build the LuCI app
        run: ./package/luci-app-hermes/build.sh

      - name: it installs, runs, and keeps the key out of sight
        run: ARCH=${{ matrix.arch }} ./scripts/gate-package.sh

      - name: the web interface installs, registers on ubus, and gives no key back
        run: ARCH=${{ matrix.arch }} ./scripts/gate-luci.sh

      # A gate nobody has seen go red is a gate nobody has tested. Each fault below is
      # one a real change could introduce, and each must be caught by a different check.
      # They are applied to the already-built tree and repackaged, rather than rebuilt
      # from scratch, because a full rebuild per fault would triple the job for no extra
      # signal.
      - name: the gate has teeth
        run: ARCH=${{ matrix.arch }} ./scripts/teeth.sh

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-agent-${{ matrix.arch }}
          path: |
            hermes-agent-*.apk
            luci-app-hermes-*.apk
          # 56 MB per architecture; a fortnight is long enough to try one on a router
          # and short enough not to hoard.
          retention-days: 14

  # The feed is published only from main, and only when the packages behind it have
  # already passed their gates. A signed feed that ships something untested is worse
  # than no feed: the signature says a person stands behind it.
  feed:
    needs: package
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3

      - name: build every architecture, both release lines
        run: |
          # One aarch64 tree per line, relabelled for the Flint 2's exact architecture
          # string as well: a router will not look at a package declaring any other name,
          # and OpenWrt publishes no aarch64_cortex-a53 rootfs to build in.
          EXTRA_ARCHES=aarch64_cortex-a53 ./package/hermes-agent/build-in-container.sh aarch64_generic
          ./package/hermes-agent/build-in-container.sh x86_64
          ./package/luci-app-hermes/build.sh
          # 24.10 needs its own trees: Python 3.11 there, so a different wheel set.
          RELEASE=24.10.8 EXTRA_ARCHES=aarch64_cortex-a53 ./package/hermes-agent/build-in-container.sh aarch64_generic
          RELEASE=24.10.8 ./package/hermes-agent/build-in-container.sh x86_64
          FORMAT=ipk ./package/luci-app-hermes/build.sh

      - name: sign the packages and the index
        env:
          SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
          USIGN_KEY: ${{ secrets.FEED_USIGN_KEY }}
        run: |
          set -eu
          [ -n "$SIGNING_KEY" ] || { echo "FEED_SIGNING_KEY is not set; nothing can be signed"; exit 1; }
          # Written to a file because apk takes a path, then removed in the same job.
          # umask first, so it is never briefly world-readable on the runner.
          umask 077
          printf '%s' "$SIGNING_KEY" > /tmp/feed.key
          SIGN_KEY=/tmp/feed.key ./scripts/build-feed.sh
          rm -f /tmp/feed.key
          # 24.10 signs with usign and a different key entirely; neither works for the
          # other line, so a missing second secret has to stop the job rather than
          # publish half a feed.
          [ -n "$USIGN_KEY" ] || { echo "FEED_USIGN_KEY is not set; the 24.10 half cannot be signed"; exit 1; }
          printf '%s' "$USIGN_KEY" > /tmp/usign.sec
          SIGN_KEY=/tmp/usign.sec ./scripts/build-feed-opkg.sh
          rm -f /tmp/usign.sec

      - name: the 25.12 feed must install without --allow-untrusted
        run: ARCH=x86_64 ./scripts/gate-feed.sh

      - name: the 24.10 feed must be refused without its key and pass with it
        run: ARCH=x86_64 ./scripts/gate-feed-opkg.sh

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: feed-out
      - id: deploy
        uses: actions/deploy-pages@v4
