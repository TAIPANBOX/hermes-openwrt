name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Seconds, no containers, and it fails for a reason no container run would catch: a
  # feature file that has drifted from the checks it claims to describe. Reading the
  # scenarios instead of the code is the whole point of writing them, and that only
  # holds while the link is enforced.
  scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every scenario names a check, and every check is described
        run: ./scripts/gate-scenarios-bound.sh
      - name: the repository names only the routers it is tested on
        run: ./scripts/gate-named-routers.sh && ./scripts/teeth-named-routers.sh
      - name: the README's figures come from their data, and every picture, link and anchor resolves
        run: ./scripts/gate-figures.sh && ./scripts/teeth-figures.sh
      - name: the daily upstream check opens one issue per newer release, and fails when it cannot see
        run: ./scripts/gate-upstream-watch.sh && ./scripts/teeth-upstream-watch.sh
      - name: apk retries a download the feed cut off, and nothing else, in every container script
        run: ./scripts/test-apk-retry.sh

  # There is nothing to unit test here: the payload is upstream's, and what this
  # repository contributes is the assembly and the service around it. So the only
  # honest test is to build the package and install it on the operating system it
  # targets, which is what this does.
  package:
    # A native arm64 runner (2026-09-25): the routers are aarch64, and under QEMU on an
    # x86 runner this job took 1 h 41 min. GitHub's arm64 runners are free for public
    # repositories and not offered to private ones, so making this repository private
    # would take this job away rather than bill for it.
    runs-on: ubuntu-24.04-arm
    # package/upstream/fetch.sh: the upstream archive is public; the token only lifts
    # api.github.com's anonymous rate limit, which shared runner addresses hit.
    env:
      GITHUB_TOKEN: ${{ github.token }}
    # One build, then the gates and their teeth spread over runners that each build the same
    # tree (about four minutes) and run one share. As one sequential job it took 55 min, half of
    # it the LuCI teeth (2026-10-02); the shards bring the slowest leg to about a quarter of that.
    # Free for a public repository, like the runner itself.
    name: package (${{ matrix.arch }}, ${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        # ARM only (2026-09-24): routers are what this package is for.
        # aarch64 is what a router actually is, and the architecture the wheel bet is
        # really about, so it is not optional.
        arch: [aarch64_generic]
        suite: [core, runtime, teeth, usb, usb-teeth-0, usb-teeth-1, usb-teeth-2, usb-teeth-3, luci-teeth-0, luci-teeth-1, luci-teeth-2, luci-teeth-3, unlock, unlock-teeth-0, unlock-teeth-1, unlock-teeth-2, unlock-teeth-3]
    steps:
      - uses: actions/checkout@v4

      # No QEMU any more: the runner is aarch64 itself. Say so, and stop if it is not, so a
      # changed runner label cannot quietly bring back an x86 host that would then need
      # emulation this job no longer sets up.
      - name: the runner is aarch64
        run: test "$(uname -m)" = aarch64 && uname -m

      # The aarch64 leg also emits the aarch64_cortex-a53 relabel, the label every
      # GL.iNet MediaTek router installs, so that gate-relabel.sh runs where it counts:
      # r4 shipped that label without bash and CI could not see it, because CI had
      # never produced it.
      # Packages from OpenWrt's feed, kept between runs: the release feed does not change, and its
      # server cut downloads off all day on 2026-10-08. Every container mounts it (APK_CACHE), and
      # scripts/apk-retry.sh hands it to apk as --cache-dir.
      - name: keep OpenWrt's packages between runs
        uses: actions/cache@v4
        with:
          path: ~/apk-cache
          key: apk-cache-${{ matrix.arch }}-25.12.4-v1
      - name: the package cache exists and belongs to the runner
        run: mkdir -p ~/apk-cache && echo "APK_CACHE=$HOME/apk-cache" >> "$GITHUB_ENV"

      - name: build the package inside OpenWrt ${{ matrix.arch }}
        run: EXTRA_ARCHES=${{ matrix.arch == 'aarch64_generic' && 'aarch64_cortex-a53' || '' }} ./package/hermes-agent/build-in-container.sh ${{ matrix.arch }}

      # Architecture-independent, so one build serves every router; it is built here
      # rather than in its own job because both gates want both packages present.
      # After the base package, never before: its build refuses without the base tree,
      # because the one failure it can have is claiming a file the base already owns and
      # that cannot be checked against a tree which is not there.
      - name: build the Telegram add-on
        run: EXTRA_ARCHES=${{ matrix.arch == 'aarch64_generic' && 'aarch64_cortex-a53' || '' }} ./package/hermes-agent-telegram/build-in-container.sh ${{ matrix.arch }}

      # Architecture-independent, so one build serves every router; it is built here
      # rather than in its own job because both gates want both packages present.
      - name: build the LuCI app
        run: ./package/luci-app-hermes/build.sh

      # hermes-agent depends on openwrt-mcp (0.21.5-r3), which OpenWrt's feed does not have, so
      # every gate that installs it is handed an apk built from the fork's main with that
      # repository's own mkapk.sh. Pinned to a commit, the code the feed carries, never a tag or a
      # branch name, so moving either cannot change what this tests. Since 0.21.5-r11 that is
      # 85a9ddd, the merge of the fork's PR #4 (version 0.5.0.3), on top of its PR #3 (0.5.0.2):
      # every uci_get answer redacts secret options, uci_apply refuses any change that makes the
      # router run code as root, and `status` reports both (uci_get_redacts_credentials,
      # uci_apply_refuses_code_exec), which the init asks for before it grants wireless and the
      # whole of network, and before it writes any change policy. Before it, baf6669
      # (v0.5.0-taipanbox.1).
      - uses: actions/checkout@v4
        with:
          repository: TAIPANBOX/openwrt-mcp
          ref: 85a9dddfcc9175324d6ab32a3ed58b0cd1558290
          path: openwrt-mcp-src
      - uses: actions/setup-go@v5
        with:
          go-version-file: openwrt-mcp-src/go.mod
      - name: build the openwrt-mcp apk the gates install beside hermes-agent
        run: OPENWRT_MCP_SRC="$PWD/openwrt-mcp-src" ./scripts/build-openwrt-mcp.sh ${{ matrix.arch }}
      # The feed serves openwrt-mcp under both labels; only the core leg's packages are published.
      - name: and openwrt-mcp under the label a Flint 2 and a Brume 2 report, for the feed
        if: matrix.suite == 'core' && matrix.arch == 'aarch64_generic'
        run: OPENWRT_MCP_SRC="$PWD/openwrt-mcp-src" ./scripts/build-openwrt-mcp.sh aarch64_cortex-a53

      # apk mkpkg records each file's owner as found on disk, and this runner's uid 1001 became
      # `nobody` on the router, /etc/hermes-agent included. A Mac never shows it, so it is read
      # here, from the packages, where it happened.
      - name: every file in every package is root's
        if: matrix.suite == 'core'
        run: ./scripts/gate-apk-owner.sh && ./scripts/teeth-apk-owner.sh

      - name: it installs, runs, and keeps the key out of sight
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-package.sh

      # The pinned upstream commit, uv.lock's versions, the two parts left out, and what
      # upstream ships beside the wheel found where the package put it.
      - name: it carries the pinned upstream, as upstream locks it
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-upstream.sh

      - name: and that gate has teeth
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/teeth-upstream.sh

      - name: the add-on installs beside the base and neither claims the other's files
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-telegram.sh

      - name: and so does the add-on's gate
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/teeth-telegram.sh

      - name: the relabel gate has teeth
        if: matrix.suite == 'core'
        run: ./scripts/teeth-relabel.sh

      - name: the web interface installs, registers on ubus, and gives no key back
        if: matrix.suite == 'core'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-luci.sh

      - name: gateway controls and their mutation tests
        if: matrix.suite == 'runtime'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-runtime.sh

      # A gate nobody has seen go red is a gate nobody has tested. Each fault below is
      # one a real change could introduce, and each must be caught by a different check.
      # They are applied to the already-built tree and repackaged, rather than rebuilt
      # from scratch, because a full rebuild per fault would triple the job for no extra
      # signal.
      - name: the gate has teeth
        if: matrix.suite == 'teeth'
        run: ARCH=${{ matrix.arch }} ./scripts/teeth.sh

      - name: hermes-usb moves the data to a stick and back, and the agent will not start without it
        if: matrix.suite == 'usb'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-usb.sh

      - name: and that gate has teeth, quarter ${{ matrix.suite }}
        if: startsWith(matrix.suite, 'usb-teeth-')
        env:
          MATRIX_SUITE: ${{ matrix.suite }}
        run: ARCH=${{ matrix.arch }} SHARD=${MATRIX_SUITE#usb-teeth-}/4 ./scripts/teeth-usb.sh

      # Every shard plants every fault and runs the gate for its own quarter of them, and each
      # checks that 33 were planted, so a fault dropped from the script fails all four.
      - name: the web interface's gate has teeth, quarter ${{ matrix.suite }}
        if: startsWith(matrix.suite, 'luci-teeth-')
        run: ARCH=${{ matrix.arch }} SHARD=${MATRIX_SUITE#luci-teeth-}/4 ./scripts/teeth-luci.sh
        env:
          MATRIX_SUITE: ${{ matrix.suite }}

      # The owner unlock: 41 checks in OpenWrt's own rootfs with all four packages, the real
      # gateway, the real daemon and the stand-ins for Telegram and the model.
      - name: changes wait for the owner's unlock, and the unlock never reaches the model
        if: matrix.suite == 'unlock'
        run: ARCH=${{ matrix.arch }} ./scripts/gate-unlock.sh

      - name: and that gate has teeth, quarter ${{ matrix.suite }}
        if: startsWith(matrix.suite, 'unlock-teeth-')
        run: ARCH=${{ matrix.arch }} SHARD=${MATRIX_SUITE#unlock-teeth-}/4 ./scripts/teeth-unlock.sh
        env:
          MATRIX_SUITE: ${{ matrix.suite }}
          # The unlock leg runs the whole gate with nothing planted; shard 0 need not repeat it.
          CLEAN_RUN_ELSEWHERE: '1'

      # What the feed publishes, exactly as built and gated here, so publish-feed.sh FROM_CI=<run>
      # only signs on the workstation and builds nothing there. source-tree names the git tree it
      # was built from; publish-feed.sh refuses a run whose tree is not the one it publishes.
      - name: record the source tree these packages were built from
        if: matrix.suite == 'core'
        run: git rev-parse 'HEAD^{tree}' > build/source-tree
      - uses: actions/upload-artifact@v4
        if: matrix.suite == 'core'
        with:
          name: hermes-agent-${{ matrix.arch }}
          path: |
            build/source-tree
            build/25.12/*/*.apk
            build/luci-app-hermes-apk/*.apk
          # About 71 MB per architecture since 0.21.5; a fortnight is long enough to try one on a router
          # and short enough not to hoard.
          retention-days: 14
