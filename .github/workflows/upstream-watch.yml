name: upstream-watch

# Upstream Hermes tags a release every few days. This notices one carrying a newer version
# than the pinned one and opens a single issue for it; moving the package stays a reviewed change.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions: {}

# A manual run that overlaps the scheduled one could otherwise open the same issue twice.
concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: the watcher still does what its scenarios say
        run: ./scripts/gate-upstream-watch.sh
      - name: compare the pinned version with upstream's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/upstream-watch.sh
