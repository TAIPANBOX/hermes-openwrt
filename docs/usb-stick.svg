<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Hermes on a USB stick: a GL-MT3000 Beryl AX with 512 MB of memory runs Hermes from a stick, and the two ways to put Hermes on USB">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
</defs>

<rect x="0" y="0" width="1280" height="520" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="520" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<text x="48" y="60" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Hermes on a USB stick</text>
<text x="48" y="86" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Vanilla OpenWrt 25.12.5, aarch64_cortex-a53, Hermes 0.21.5-r5 from the signed feed, measured 2026-10-04</text>

<!-- left: Beryl AX -->
<rect x="48" y="118" width="580" height="360" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>

<!-- device drawing, front view as in GL.iNet's photos: a pale blue-grey rounded body, two flat
     paddle antennas standing at the ends, USB-C power, WAN and LAN, a vertical USB 3.0 port
     with its blue insert, here holding the stick -->
<g transform="translate(78,138)">
  <rect x="214" y="14" width="24" height="98" rx="12" fill="#8d9eb1"/>
  <rect x="2" y="0" width="28" height="112" rx="14" fill="#a7b7c9"/>
  <text transform="translate(20,62) rotate(-90)" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9" font-weight="600" fill="#6d7d8f" text-anchor="middle">WiFi 6</text>
  <rect x="0" y="72" width="244" height="76" rx="24" fill="#b6c5d5"/>
  <rect x="10" y="72" width="224" height="10" rx="5" fill="#c9d6e3"/>
  <text x="44" y="100" font-family="ui-sans-serif,system-ui,sans-serif" font-size="6" fill="#6d7d8f" text-anchor="middle">5V⎓3A</text>
  <rect x="35" y="106" width="18" height="7" rx="3.5" fill="#3a4450"/>
  <rect x="88" y="94" width="72" height="34" rx="5" fill="#e6ecf2" stroke="#8d9eb1"/>
  <text x="106" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="6" fill="#6d7d8f" text-anchor="middle">WAN</text>
  <text x="142" y="91" font-family="ui-sans-serif,system-ui,sans-serif" font-size="6" fill="#6d7d8f" text-anchor="middle">LAN</text>
  <rect x="93" y="100" width="26" height="22" rx="2" fill="#4a5562"/><rect x="100" y="117" width="12" height="5" fill="#e6ecf2"/>
  <rect x="129" y="100" width="26" height="22" rx="2" fill="#4a5562"/><rect x="136" y="117" width="12" height="5" fill="#e6ecf2"/>
  <rect x="190" y="96" width="14" height="28" rx="2" fill="#2f6fd6"/>
  <rect x="186" y="84" width="22" height="50" rx="5" fill="#1f2a38" stroke="#4493f8" stroke-width="1.5"/>
  <text transform="translate(201,109) rotate(-90)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="8" fill="#9aa7b8" text-anchor="middle">32 GB</text>
  <rect x="34" y="148" width="22" height="5" rx="2" fill="#6d7d8f"/>
  <rect x="188" y="148" width="22" height="5" rx="2" fill="#6d7d8f"/>
</g>

<text x="352" y="172" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" font-weight="600" fill="#e6edf3">GL-MT3000</text>
<text x="352" y="194" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">GL.iNet Beryl AX, travel size</text>

<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">
  <text x="352" y="228">MT7981  2x Cortex-A53</text>
  <text x="352" y="252">512 MB RAM  256 MB NAND</text>
  <text x="352" y="276">32 GB stick, USB 3</text>
</g>

<rect x="92" y="296" width="500" height="1" fill="#1b2331"/>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
  <text x="92" y="324" fill="#69788b">install onto the stick</text>  <text x="300" y="324" fill="#e6edf3">75 s, 325 MB</text>
  <text x="92" y="348" fill="#69788b">written to internal flash</text><text x="300" y="348" fill="#3fb950">0 KB</text>
  <text x="92" y="372" fill="#69788b">gateway resident</text>         <text x="300" y="372" fill="#e6edf3">202 MB</text>
  <text x="92" y="396" fill="#69788b">free memory, gateway up</text>  <text x="300" y="396" fill="#e3b341">156 MB</text>
  <text x="92" y="420" fill="#69788b">one conversation</text>         <text x="300" y="420" fill="#e6edf3">35 s, free never under 113 MB</text>
  <text x="92" y="444" fill="#69788b">more than one at a time</text>  <text x="300" y="444" fill="#e3b341">not measured</text>
</g>

<!-- right: the two ways -->
<rect x="652" y="118" width="580" height="360" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="680" y="152" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600" letter-spacing="0.6">TWO WAYS TO PUT IT ON USB</text>

<g font-family="ui-sans-serif,system-ui,sans-serif">
  <rect x="680" y="170" width="250" height="132" rx="10" fill="#0f1520" stroke="#30363d"/>
  <text x="700" y="198" font-size="15" font-weight="600" fill="#e6edf3">Data directory only</text>
  <text x="700" y="220" font-size="12" fill="#69788b">/srv/hermes on the stick,</text>
  <text x="700" y="238" font-size="12" fill="#69788b">the programs stay inside.</text>
  <text x="700" y="262" font-size="12" fill="#9aa7b8">Needs ~350 MB of flash.</text>
  <text x="700" y="284" font-size="12" fill="#9aa7b8">Stick missing: Hermes starts</text>
  <text x="700" y="300" font-size="12" fill="#9aa7b8">on internal storage.</text>

  <rect x="954" y="170" width="250" height="132" rx="10" fill="#0f1520" stroke="#30363d"/>
  <text x="974" y="198" font-size="15" font-weight="600" fill="#e6edf3">Everything (extroot)</text>
  <text x="974" y="220" font-size="12" fill="#69788b">OpenWrt's whole writable layer</text>
  <text x="974" y="238" font-size="12" fill="#69788b">on the stick; firmware inside.</text>
  <text x="974" y="262" font-size="12" fill="#9aa7b8">Needs no free flash at all.</text>
  <text x="974" y="284" font-size="12" fill="#9aa7b8">Stick missing: the router boots</text>
  <text x="974" y="300" font-size="12" fill="#9aa7b8">its own layer, no Hermes.</text>
</g>

<text x="680" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600" letter-spacing="0.6">WHAT THE GATEWAY WRITES, IDLE</text>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13">
  <text x="680" y="364" fill="#69788b">PLACEHOLDER_ROW1_LABEL</text><text x="1204" y="364" fill="#e6edf3" text-anchor="end">PLACEHOLDER_ROW1</text>
  <text x="680" y="388" fill="#69788b">PLACEHOLDER_ROW2_LABEL</text><text x="1204" y="388" fill="#e6edf3" text-anchor="end">PLACEHOLDER_ROW2</text>
  <text x="680" y="412" fill="#69788b">PLACEHOLDER_ROW3_LABEL</text><text x="1204" y="412" fill="#e6edf3" text-anchor="end">PLACEHOLDER_ROW3</text>
  <text x="680" y="444" font-size="12" fill="#69788b">PLACEHOLDER_NOTE</text>
</g>
</svg>
