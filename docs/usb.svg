<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Small flash routers: moving the data directory to a USB stick cuts writes to internal flash by about seventy times">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2dd4bf"/></marker>
</defs>
<rect width="1280" height="560" fill="url(#bg)"/><rect width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Routers with little flash: move the data directory</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">The package is 185 MB installed, and the agent downloads a further 34 MB helper on first run. Budget 220 MB. Most routers do not have it, and the ones that do would rather not write to it.</text>

<!-- left: what needs room -->
<rect x="48" y="112" width="368" height="212" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="72" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">WHAT NEEDS ROOM</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <text x="72" y="176" fill="#9aa7b8">package, installed</text><text x="330" y="176" fill="#e6edf3">185 MB</text>
  <text x="72" y="204" fill="#9aa7b8">helper, first run</text><text x="330" y="204" fill="#e6edf3">34 MB</text>
  <text x="72" y="232" fill="#9aa7b8">sessions and memory</text><text x="330" y="232" fill="#e6edf3">grows</text>
  <line x1="72" y1="248" x2="392" y2="248" stroke="#1b2331"/>
  <text x="72" y="276" fill="#e6edf3">budget</text><text x="315" y="276" fill="#2dd4bf" font-weight="600">~220 MB</text>
  <text x="72" y="304" fill="#69788b" font-size="12">a 128 MB router cannot hold this at all</text>
</g>

<!-- middle: the move -->
<g transform="translate(452,150)">
  <rect x="0" y="18" width="150" height="86" rx="10" fill="#1b2331" stroke="#4493f8" stroke-opacity="0.5" stroke-width="2"/>
  <text x="75" y="48" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">router</text>
  <text x="75" y="70" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#69788b">internal flash</text>
  <text x="75" y="88" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#69788b">firmware lives here</text>

  <path d="M 158 61 L 214 61" stroke="#2dd4bf" stroke-width="2" marker-end="url(#ar)"/>
  <text x="186" y="14" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11" fill="#2dd4bf">/srv/hermes</text>

  <rect x="222" y="30" width="120" height="62" rx="8" fill="#1b2331" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="234" y="46" width="52" height="30" rx="4" fill="#11161f" stroke="#69788b"/>
  <rect x="294" y="54" width="36" height="14" rx="3" fill="#2dd4bf" opacity="0.6"/>
  <text x="282" y="112" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">USB stick, ext4</text>
</g>

<!-- right: the effect -->
<rect x="852" y="112" width="380" height="212" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="876" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#2dd4bf">WRITES TO INTERNAL FLASH</text>
<text x="876" y="172" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">per agent session</text>

<rect x="876" y="184" width="332" height="30" rx="4" fill="#1b2331"/>
<rect x="876" y="184" width="300" height="30" rx="4" fill="#e3b341"/>
<text x="890" y="204" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#0a0e16" font-weight="600">data dir on flash   850 kB</text>

<rect x="876" y="226" width="332" height="30" rx="4" fill="#1b2331"/>
<rect x="876" y="226" width="10" height="30" rx="4" fill="#3fb950"/>
<text x="898" y="246" font-family="ui-monospace,Menlo,monospace" font-size="13" fill="#9aa7b8">data dir on USB      12 kB</text>

<text x="876" y="288" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">About <tspan fill="#e6edf3" font-weight="600">seventy times less</tspan>, and no slower:</text>
<text x="876" y="308" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">25 s per session either way.</text>

<!-- bottom: the honest caveat -->
<rect x="48" y="352" width="1184" height="164" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="72" y="382" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#2dd4bf">WHEN IT IS WORTH DOING, AND WHEN IT IS NOT</text>
<g font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">
  <text x="72" y="412"><tspan fill="#3fb950">Worth it</tspan> when the router has no room for 220 MB, which is most of them, or when you would rather the agent did not write to the</text>
  <text x="72" y="432">same flash the firmware boots from.</text>
  <text x="72" y="462"><tspan fill="#e3b341">Not about wear</tspan>. At 850 kB per session, a hundred sessions a day is about 31 GB a year, and eMMC endurance is measured in</text>
  <text x="72" y="482">tens of terabytes. The stick solves space and separation, not lifespan. It does take 924 kB per session plus 228 kB every 30 s</text>
  <text x="72" y="502">while the gateway idles, because the journal is written continuously, so use a stick you do not mind replacing.</text>
</g>
</svg>
