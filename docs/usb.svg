<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Routers with little flash: what Hermes 0.21.5 needs room for, and moving the data directory to a USB stick">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="470" fill="url(#bg)"/><rect width="1280" height="470" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#e6edf3" font-weight="600">Routers with little flash: move the data directory</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Hermes 0.21.5, measured 2026-09-25 on both routers, each cleaned of the package first.</text>
<rect x="48" y="110" width="560" height="250" rx="10" fill="#0f1520" stroke="#30363d"/>
<text x="72" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">WHAT NEEDS ROOM, FROM A CLEAN ROUTER</text>
<text x="72" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">agent, web page, Python, ffmpeg</text>
<text x="584" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">332-337 MB</text>
<text x="72" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">Telegram add-on</text>
<text x="584" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">12 MB</text>
<text x="72" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">first start: helper and skills</text>
<text x="584" y="236" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">37 MB</text>
<text x="72" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">sessions and memory</text>
<text x="584" y="266" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">grows</text>
<line x1="72" y1="284" x2="584" y2="284" stroke="#30363d"/>
<text x="72" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">budget</text>
<text x="584" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#2dd4bf" font-weight="600" text-anchor="end">400 MB and up</text>
<text x="72" y="336" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">a router with 128 MB of flash cannot hold this at all</text>
<rect x="640" y="110" width="592" height="250" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="672" y="150" width="240" height="170" rx="10" fill="#1b2331" stroke="#30363d"/>
<text x="792" y="180" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#e6edf3" font-weight="600" text-anchor="middle">router</text>
<rect x="692" y="200" width="200" height="100" rx="8" fill="#0f1520" stroke="#30363d"/>
<text x="792" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8" text-anchor="middle">internal flash</text>
<text x="792" y="254" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b" text-anchor="middle">firmware lives here</text>
<text x="792" y="280" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#69788b" text-anchor="middle">/usr/lib/hermes-agent</text>
<rect x="992" y="200" width="200" height="100" rx="8" fill="#0f1520" stroke="#2dd4bf"/>
<text x="1092" y="232" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3" text-anchor="middle">USB stick, ext4</text>
<text x="1092" y="256" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#2dd4bf" text-anchor="middle">/srv/hermes</text>
<text x="1092" y="280" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b" text-anchor="middle">sessions, memory, journal</text>
<line x1="912" y1="250" x2="990" y2="250" stroke="#2dd4bf" stroke-width="2"/>
<text x="48" y="396" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">Worth it when you would rather sessions and memory did not keep growing on the same flash the firmware boots from.</text>
<text x="48" y="420" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">Moving data_dir moves that state. It does not free the 239 MB package tree, which stays under /usr/lib and /usr/share/hermes-agent either way.</text>
</svg>
