<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
</defs>

<rect x="0" y="0" width="1280" height="520" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="520" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<line x1="640" y1="100" x2="640" y2="394" stroke="#222b38" stroke-width="1"/>

<!-- left column: OpenWrt 25.12 / apk -->
<rect x="60" y="100" width="550" height="210" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="60" y="100" width="6" height="210" rx="3" ry="3" fill="#2dd4bf"/>
<text x="86" y="132" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">OpenWrt 25.12</text>
<rect x="552" y="112" width="44" height="22" rx="11" ry="11" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="574" y="127" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">apk</text>
<line x1="86" y1="148" x2="584" y2="148" stroke="#222b38" stroke-width="1"/>
<text x="86" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">index packages.adb, binary</text>
<text x="86" y="204" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">signed with EC prime256v1</text>
<text x="86" y="228" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">signature inside the index</text>
<text x="86" y="252" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">keys in /etc/apk/keys</text>
<text x="86" y="276" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">packages AND index signed</text>

<!-- right column: OpenWrt 24.10 / opkg -->
<rect x="670" y="100" width="550" height="210" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="670" y="100" width="6" height="210" rx="3" ry="3" fill="#4493f8"/>
<text x="696" y="132" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">OpenWrt 24.10</text>
<rect x="1154" y="112" width="52" height="22" rx="11" ry="11" fill="#141a23" stroke="#4493f8" stroke-width="1"/>
<text x="1180" y="127" font-size="12.5" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">opkg</text>
<line x1="696" y1="148" x2="1194" y2="148" stroke="#222b38" stroke-width="1"/>
<text x="696" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">index Packages + Packages.gz</text>
<text x="696" y="204" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">signed with usign, Ed25519</text>
<text x="696" y="228" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">separate Packages.sig</text>
<text x="696" y="252" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">keys in /etc/opkg/keys</text>
<text x="696" y="276" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">the index only is signed</text>

<!-- Outcomes: both states drawn at once, side by side.
     They were a crossfade first, and that was wrong: at any instant a still render
     showed only one of them, so a reader saw two red pills and concluded the feed does
     not work. Meaning must never live only in motion. The green pill pulses gently
     instead, which adds life without hiding anything. -->
<text x="335" y="352" font-size="13" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">what apk does</text>
<g>
  <rect x="150" y="366" width="176" height="26" rx="13" ry="13" fill="#141a23" stroke="#ff6b63" stroke-width="1.2"/>
  <text x="238" y="383" font-size="12.5" fill="#ff6b63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">no such package</text>
  <text x="238" y="408" font-size="12" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">without the key</text>
</g>
<g>
  <rect x="344" y="366" width="176" height="26" rx="13" ry="13" fill="#141a23" stroke="#3fb950" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="432" y="383" font-size="12.5" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">installs, verified</text>
  <text x="432" y="408" font-size="12" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">with the key</text>
</g>

<text x="945" y="352" font-size="13" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">what opkg does</text>
<g>
  <rect x="752" y="366" width="186" height="26" rx="13" ry="13" fill="#141a23" stroke="#ff6b63" stroke-width="1.2"/>
  <text x="845" y="383" font-size="12.5" fill="#ff6b63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Signature check failed</text>
  <text x="845" y="408" font-size="12" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">without the key</text>
</g>
<g>
  <rect x="956" y="366" width="186" height="26" rx="13" ry="13" fill="#141a23" stroke="#3fb950" stroke-width="1.2">
    <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="1049" y="383" font-size="12.5" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Signature check passed</text>
  <text x="1049" y="408" font-size="12" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">with the key</text>
</g>

<text x="640" y="452" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Neither key works for the other line.</text>

<text x="1252" y="498" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/hermes-openwrt</text>
</svg>
