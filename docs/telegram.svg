<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <marker id="aTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
  </marker>
  <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#4493f8"/>
  </marker>
</defs>

<rect x="0" y="0" width="1280" height="560" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<text x="640" y="62" font-size="24" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">The router calls out. Nothing calls in.</text>

<!-- the phone -->
<g filter="url(#soft)">
  <rect x="60" y="120" width="280" height="170" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="60" y="120" width="6" height="170" rx="3" fill="#4493f8"/>
</g>
<text x="84" y="158" font-size="19" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">your phone</text>
<rect x="244" y="138" width="76" height="22" rx="11" fill="#141a23" stroke="#4493f8"/>
<text x="282" y="153" font-size="12" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">anywhere</text>
<text x="84" y="200" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">You send a message to</text>
<text x="84" y="224" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">a bot you made with</text>
<text x="84" y="248" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">@BotFather</text>
<text x="84" y="274" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">No app to install.</text>

<!-- phone to telegram -->
<line x1="352" y1="205" x2="488" y2="205" stroke="#4493f8" stroke-width="2.5" marker-end="url(#aBlue)"/>
<circle r="5" fill="#4493f8">
  <animateMotion dur="5s" repeatCount="indefinite" path="M 352 205 L 482 205"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- telegram -->
<g filter="url(#soft)">
  <rect x="500" y="120" width="280" height="170" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="500" y="120" width="6" height="170" rx="3" fill="#4493f8"/>
</g>
<text x="524" y="158" font-size="19" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">Telegram</text>
<rect x="668" y="138" width="92" height="22" rx="11" fill="#141a23" stroke="#4493f8"/>
<text x="714" y="153" font-size="12" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">their side</text>
<text x="524" y="200" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">Holds the message until</text>
<text x="524" y="224" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">something asks for it.</text>
<text x="524" y="252" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">The bot token is what</text>
<text x="524" y="274" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">makes that asking work.</text>

<!-- the poll, router to telegram -->
<line x1="930" y1="172" x2="796" y2="172" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#aTeal)"/>
<text x="863" y="160" font-size="13" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">getUpdates</text>
<circle r="4.5" fill="#2dd4bf">
  <animateMotion dur="5s" repeatCount="indefinite" path="M 930 172 L 802 172"/>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.36;0.55;0.6" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- the reply, telegram to router, on that same connection -->
<line x1="796" y1="240" x2="930" y2="240" stroke="#4493f8" stroke-width="2.5" marker-end="url(#aBlue)"/>
<text x="863" y="262" font-size="13" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">the message</text>
<circle r="4.5" fill="#4493f8">
  <animateMotion dur="5s" repeatCount="indefinite" path="M 796 240 L 924 240"/>
  <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.66;0.88;0.94" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- the router -->
<g filter="url(#soft)">
  <rect x="940" y="120" width="280" height="170" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="940" y="120" width="6" height="170" rx="3" fill="#2dd4bf"/>
</g>
<text x="964" y="158" font-size="19" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">your router</text>
<rect x="1124" y="138" width="76" height="22" rx="11" fill="#141a23" stroke="#2dd4bf"/>
<text x="1162" y="153" font-size="12" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">outbound</text>
<text x="964" y="200" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">hermes-agent asks, on a</text>
<text x="964" y="224" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">connection it opened.</text>
<text x="964" y="252" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">Works behind NAT, behind</text>
<text x="964" y="274" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">CGNAT, on a dynamic IP.</text>

<!-- what you do not have to do -->
<g stroke="#ff6b63" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
  <line x1="86" y1="332" x2="106" y2="352"/>
  <line x1="106" y1="332" x2="86" y2="352"/>
</g>
<text x="124" y="349" font-size="15" fill="#ff6b63" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">Nothing to forward, no dynamic DNS, no inbound firewall rule, no certificate.</text>

<!-- the allowlist -->
<g filter="url(#soft)">
  <rect x="60" y="378" width="1160" height="98" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="60" y="378" width="6" height="98" rx="3" fill="#e3b341"/>
</g>
<text x="84" y="410" font-size="18" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">and then one question, asked before any message is read</text>

<rect x="84" y="428" width="360" height="32" rx="6" fill="#141a23" stroke="#3fb950"/>
<text x="100" y="449" font-size="14" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">allow_user_id 123456789</text>
<text x="312" y="449" font-size="14" fill="#3fb950" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">answered</text>

<rect x="464" y="428" width="230" height="32" rx="6" fill="#141a23" stroke="#ff6b63"/>
<text x="480" y="449" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">anyone else</text>
<text x="610" y="449" font-size="14" fill="#ff6b63" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">ignored</text>

<rect x="714" y="428" width="392" height="32" rx="6" fill="#141a23" stroke="#e3b341"/>
<text x="730" y="449" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">nobody listed</text>
<text x="842" y="449" font-size="14" fill="#e3b341" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">the service refuses to start</text>
<g opacity="0.9">
  <animate attributeName="opacity" values="0.55;1;0.55" dur="3.2s" repeatCount="indefinite"/>
  <circle cx="1078" cy="444" r="5" fill="#e3b341"/>
</g>

<text x="640" y="512" font-size="16" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Upstream already ignores an unlisted user. Refusing to start is about the case where nobody is listed at all.</text>
<text x="640" y="538" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">A bot that answers nobody looks exactly like a broken one, and the switch that "fixes" it is the one that answers everybody.</text>

<text x="1256" y="556" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/hermes-openwrt</text>
</svg>
