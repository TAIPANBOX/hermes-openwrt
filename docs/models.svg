<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-label="Which models can call a tool on the router: nine models, one turn each, Hermes 0.21.5">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="610" fill="url(#bg)"/><rect width="1280" height="610" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#e6edf3" font-weight="600">Which models can actually drive it</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Hermes 0.21.5 on the Brume 2, 2026-09-25, through OpenRouter: read /proc/uptime with the terminal tool, answer in minutes. One turn per model.</text>
<text x="48" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">MODEL</text>
<text x="390" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">TOOL CALL</text>
<text x="510" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">RIGHT</text>
<text x="610" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">WALL CLOCK</text>
<text x="740" y="124" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">WHAT CAME BACK</text>
<rect x="40" y="138" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">anthropic/claude-haiku-4.5</text>
<text x="390" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="158" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">18 s</text>
<text x="740" y="158" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">15,464.68 minutes, with the arithmetic shown</text>
<rect x="40" y="176" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">google/gemini-2.5-flash</text>
<text x="390" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">4 s</text>
<text x="740" y="196" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">clean one-line answer</text>
<rect x="40" y="214" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">openai/gpt-4o-mini</text>
<text x="390" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">7 s</text>
<text x="740" y="234" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">clean one-line answer</text>
<rect x="40" y="252" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">moonshotai/kimi-k2-0905</text>
<text x="390" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="272" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">11 s</text>
<text x="740" y="272" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">clean, with hours and days added</text>
<rect x="40" y="290" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">deepseek/deepseek-chat-v3.1</text>
<text x="390" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">16 s</text>
<text x="740" y="310" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">three tool calls where one would do</text>
<rect x="40" y="328" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">qwen/qwen3-8b</text>
<text x="390" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="348" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">14 s</text>
<text x="740" y="348" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">8B, and it works</text>
<rect x="40" y="366" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">mistralai/mistral-small-3.2-24b</text>
<text x="390" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="510" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3fb950">yes</text>
<text x="610" y="386" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">4 s</text>
<text x="740" y="386" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">clean one-line answer</text>
<rect x="40" y="404" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">meta-llama/llama-3.3-70b</text>
<text x="390" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e3b341">cut off</text>
<text x="510" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f85149">no</text>
<text x="610" y="424" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">15 s</text>
<text x="740" y="424" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">hit its output limit mid-call; Hermes refused to run it</text>
<rect x="40" y="442" width="1200" height="32" rx="6" fill="#0f1520" opacity="0.6"/>
<text x="48" y="462" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">google/gemma-3-12b-it</text>
<text x="390" y="462" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f85149">no</text>
<text x="510" y="462" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#f85149">no</text>
<text x="610" y="462" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">5 s</text>
<text x="740" y="462" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">printed the call as JSON text and stopped</text>
<rect x="48" y="504" width="1184" height="90" rx="10" fill="#0f1520" stroke="#30363d"/>
<text x="72" y="534" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">THE FLOOR IS NATIVE TOOL CALLING, NOT PARAMETER COUNT</text>
<text x="72" y="560" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">An 8B model works. A 12B model without tool support prints the call as text. A 70B model can still fail on the output limit its provider sets.</text>
<text x="72" y="582" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">“Tool call” is counted from the turn&#x27;s own messages; “right” is the answer checked against the router&#x27;s uptime. Pick for function calling, not for size.</text>
</svg>
