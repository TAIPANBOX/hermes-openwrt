<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-label="Which models can call a tool on the router: nine models tested, the floor is native tool calling rather than parameter count">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/></filter>
</defs>

<rect width="1280" height="610" fill="url(#bg)"/><rect width="1280" height="610" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>

<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="600" fill="#e6edf3">Which models can actually drive it</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Same task, same router, through OpenRouter: read /proc/uptime with the terminal tool, then answer. Nine models, one question: did it call the tool, or talk about calling it?</text>

<!-- column headers -->
<text x="48"  y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">MODEL</text>
<text x="470" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">TOOL CALL</text>
<text x="640" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">WALL CLOCK</text>
<text x="890" y="128" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#2dd4bf">WHAT CAME BACK</text>
<line x1="48" y1="140" x2="1232" y2="140" stroke="#1b2331" stroke-width="1"/>

<!-- rows: y, name, verdict colour, bar width (24s = 240px baseline), seconds, note -->
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
  <text x="48" y="172" fill="#e6edf3">anthropic/claude-haiku-4.5</text>
  <circle cx="484" cy="167" r="6" fill="#3fb950"/><text x="500" y="172" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="160" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="160" width="167" height="14" rx="3" fill="#3fb950" opacity="0.8"/>
  <text x="850" y="172" fill="#9aa7b8" font-size="12">25 s</text>
  <text x="890" y="172" fill="#69788b" font-size="12">the reference run</text>

  <text x="48" y="208" fill="#e6edf3">google/gemini-2.5-flash</text>
  <circle cx="484" cy="203" r="6" fill="#3fb950"/><text x="500" y="208" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="196" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="196" width="167" height="14" rx="3" fill="#3fb950" opacity="0.8"/>
  <text x="850" y="208" fill="#9aa7b8" font-size="12">25 s</text>
  <text x="890" y="208" fill="#69788b" font-size="12">clean one-line answer</text>

  <text x="48" y="244" fill="#e6edf3">openai/gpt-4o-mini</text>
  <circle cx="484" cy="239" r="6" fill="#3fb950"/><text x="500" y="244" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="232" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="232" width="160" height="14" rx="3" fill="#3fb950" opacity="0.8"/>
  <text x="850" y="244" fill="#9aa7b8" font-size="12">24 s</text>
  <text x="890" y="244" fill="#69788b" font-size="12">clean one-line answer</text>

  <text x="48" y="280" fill="#e6edf3">moonshotai/kimi-k2-0905</text>
  <circle cx="484" cy="275" r="6" fill="#3fb950"/><text x="500" y="280" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="268" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="268" width="167" height="14" rx="3" fill="#3fb950" opacity="0.8"/>
  <text x="850" y="280" fill="#9aa7b8" font-size="12">25 s</text>
  <text x="890" y="280" fill="#69788b" font-size="12">clean one-line answer</text>

  <text x="48" y="316" fill="#e6edf3">deepseek/deepseek-chat-v3.1</text>
  <circle cx="484" cy="311" r="6" fill="#3fb950"/><text x="500" y="316" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="304" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="304" width="200" height="14" rx="3" fill="#e3b341" opacity="0.8"/>
  <text x="850" y="316" fill="#9aa7b8" font-size="12">34 s</text>
  <text x="890" y="316" fill="#69788b" font-size="12">leaks its reasoning into the reply</text>

  <text x="48" y="352" fill="#e6edf3">qwen/qwen3-8b</text>
  <circle cx="484" cy="347" r="6" fill="#3fb950"/><text x="500" y="352" fill="#3fb950" font-size="12">yes</text>
  <rect x="640" y="340" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="340" width="200" height="14" rx="3" fill="#e3b341" opacity="0.8"/>
  <text x="850" y="352" fill="#9aa7b8" font-size="12">43 s</text>
  <text x="890" y="352" fill="#69788b" font-size="12">slowest that still works, 8B</text>

  <text x="48" y="388" fill="#e6edf3">mistralai/mistral-small-24b</text>
  <circle cx="484" cy="383" r="6" fill="#e3b341"/><text x="500" y="388" fill="#e3b341" font-size="12">yes, but</text>
  <rect x="640" y="376" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="376" width="160" height="14" rx="3" fill="#3fb950" opacity="0.5"/>
  <text x="850" y="388" fill="#9aa7b8" font-size="12">24 s</text>
  <text x="890" y="388" fill="#e3b341" font-size="12">called it, then said 28334 minutes</text>

  <text x="48" y="424" fill="#e6edf3">meta-llama/llama-3.3-70b</text>
  <circle cx="484" cy="419" r="6" fill="#ff6b63"/><text x="500" y="424" fill="#ff6b63" font-size="12">error</text>
  <rect x="640" y="412" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="412" width="200" height="14" rx="3" fill="#ff6b63" opacity="0.5"/>
  <text x="850" y="424" fill="#9aa7b8" font-size="12">35 s</text>
  <text x="890" y="424" fill="#69788b" font-size="12">provider returned an empty stream</text>

  <text x="48" y="460" fill="#e6edf3">google/gemma-3-12b-it</text>
  <circle cx="484" cy="455" r="6" fill="#ff6b63"/><text x="500" y="460" fill="#ff6b63" font-size="12">no</text>
  <rect x="640" y="448" width="200" height="14" rx="3" fill="#1b2331"/><rect x="640" y="448" width="173" height="14" rx="3" fill="#ff6b63" opacity="0.5"/>
  <text x="850" y="460" fill="#9aa7b8" font-size="12">26 s</text>
  <text x="890" y="460" fill="#ff6b63" font-size="12">printed the call as plain text</text>
</g>

<!-- the conclusion band -->
<rect x="48" y="492" width="1184" height="88" rx="12" fill="#141a23" stroke="#1b2331" filter="url(#soft)"/>
<text x="72" y="522" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="600" fill="#2dd4bf">THE FLOOR IS NATIVE TOOL CALLING, NOT PARAMETER COUNT</text>
<text x="72" y="545" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">An 8B model works. A 12B model without tool support prints <tspan font-family="ui-monospace,Menlo,monospace" fill="#ff6b63">[terminal(command='cat /proc/uptime')]</tspan> as text and stops.</text>
<text x="72" y="564" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">A 24B model called the tool correctly and then got the answer wrong. Pick for function calling, not for size.</text>
</svg>
