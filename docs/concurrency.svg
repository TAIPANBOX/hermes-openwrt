<rect x="48" y="546" width="1184" height="120" rx="10" fill="#0f1520" stroke="#30363d"/>
<text x="72" y="576" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">READ IT LIKE THIS</text>
<text x="72" y="602" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">The gateway holds about 180 MB and stays there. All of Hermes peaked at 361 to 384 MB whether one conversation ran or six:</text>
<text x="72" y="624" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">an extra conversation costs a thread, not a second interpreter. No kernel OOM kill at any count, and 270 MB or more stayed available.</text>
<text x="72" y="646" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#9aa7b8">Cores buy time, not capacity: six at once took 25 s on four cores and 30 s on two. Fanless, 45 to 52 C.</text>
