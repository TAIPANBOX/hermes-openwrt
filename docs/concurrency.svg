<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#e6edf3" font-weight="600">How many agents fit on a 1 GB router</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Hermes 0.21.5, 2026-10-03, both routers, the same task each time (five commands through the terminal tool), model gpt-5.6-luna.</text>
<text x="48" y="106" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">“MB left” is the lowest memory the router itself still had available during the run.</text>
