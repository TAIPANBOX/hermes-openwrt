<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Measured on hardware with Hermes 0.21.5: memory, the router keeps routing, and one task end to end">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
</defs>
<rect width="1280" height="560" fill="url(#bg)"/><rect width="1280" height="560" fill="url(#grid)" opacity="0.5"/>
<rect width="1280" height="4" fill="url(#accent)"/>
<text x="48" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" fill="#e6edf3" font-weight="600">Measured on hardware</text>
<text x="48" y="84" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">GL-MT6000 (MT7986, 4 cores) and GL-MT2500 (MT7981, 2 cores), both 1 GB RAM, vanilla OpenWrt 25.12.5, Hermes 0.21.5, 2026-09-25</text>
<rect x="48" y="110" width="376" height="330" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="452" y="110" width="376" height="330" rx="10" fill="#0f1520" stroke="#30363d"/>
<rect x="856" y="110" width="376" height="330" rx="10" fill="#0f1520" stroke="#30363d"/>
<text x="72" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">MEMORY, 1 GB BOX</text>
<text x="72" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">gateway, resident</text>
<text x="400" y="176" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">179 / 178 MB</text>
<text x="72" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">all of Hermes, six at once</text>
<text x="400" y="202" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">361 / 379 MB</text>
<text x="72" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">lowest available</text>
<text x="400" y="228" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">312 / 270 MB</text>
<text x="72" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">kernel OOM kills</text>
<text x="400" y="254" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">0 / 0</text>
<text x="72" y="294" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">Flint 2 / Brume 2. A conversation is a thread</text>
<text x="72" y="314" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">of the gateway, so six cost about what one does.</text>
<text x="476" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">THE ROUTER KEEPS ROUTING</text>
<text x="476" y="170" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">Flint 2, the house&#x27;s bridge, 25 MB downloads</text>
<text x="476" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">Hermes idle</text>
<text x="804" y="196" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">340-400 Mbit/s</text>
<text x="476" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">three conversations</text>
<text x="804" y="220" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">438-458 Mbit/s</text>
<text x="476" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">kernel drops</text>
<text x="804" y="244" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">0</text>
<text x="476" y="282" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">Brume 2, a WireGuard tunnel</text>
<text x="476" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">tunnel alone</text>
<text x="804" y="308" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">574 Mbit/s</text>
<text x="476" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">three conversations</text>
<text x="804" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">404 Mbit/s</text>
<text x="476" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">the same, nice 10</text>
<text x="804" y="356" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3" text-anchor="end">439 Mbit/s</text>
<text x="880" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" font-weight="600">ONE TASK, END TO END, ON THE ROUTER</text>
<text x="880" y="174" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">you ask</text>
<text x="880" y="194" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">“uptime, load, memory, route, dnsmasq?”</text>
<text x="880" y="226" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">the model decides</text>
<text x="880" y="246" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">call the terminal tool</text>
<text x="880" y="278" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">the router runs it</text>
<text x="880" y="298" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">five commands, as root</text>
<text x="880" y="330" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">you get the answer</text>
<text x="880" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">from what they printed</text>
<text x="880" y="388" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#9aa7b8">18 s on four cores, 25 s on two.</text>
<text x="880" y="408" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#69788b">gpt-4o-mini through OpenRouter.</text>
<text x="48" y="490" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">Every figure here came from these two routers on 2026-09-25, each cleaned of the package first and put back as it was afterwards; not from a container, not from a VM.</text>
<text x="48" y="514" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" fill="#69788b">The Flint 2 carried a house&#x27;s internet throughout: 511 pings a second apart, none lost, internet median 11 ms.</text>
</svg>
