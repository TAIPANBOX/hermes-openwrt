<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</defs>

<rect x="0" y="0" width="1280" height="720" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="720" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<!-- connectors: left card -> hub -->
<line x1="380" y1="340" x2="470" y2="340" stroke="#283341" stroke-width="2"/>
<path d="M 470 340 l -11 -6 l 0 12 z" fill="#4493f8"/>
<circle cx="380" cy="340" r="4" fill="#4493f8">
  <animate attributeName="cx" values="380;470" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- connectors: hub -> right card -->
<line x1="810" y1="340" x2="900" y2="340" stroke="#283341" stroke-width="2"/>
<path d="M 900 340 l -11 -6 l 0 12 z" fill="#3fb950"/>
<circle cx="810" cy="340" r="4" fill="#3fb950">
  <animate attributeName="cx" values="810;900" dur="4s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.12;0.88;1" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- glow behind hub -->
<rect x="470" y="170" width="340" height="340" rx="14" ry="14" fill="none" stroke="#2dd4bf" stroke-width="4" filter="url(#glow)">
  <animate attributeName="opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite"/>
</rect>

<!-- hub: OpenWrt router -->
<rect x="470" y="170" width="340" height="340" rx="14" ry="14" fill="#141a23" stroke="#2dd4bf" stroke-width="1.6" filter="url(#soft)"/>
<text x="640" y="204" font-size="22" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">OpenWrt router</text>
<line x1="492" y1="218" x2="788" y2="218" stroke="#222b38" stroke-width="1"/>

<!-- hermes-agent card -->
<rect x="492" y="232" width="296" height="130" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1"/>
<rect x="492" y="232" width="6" height="130" rx="3" ry="3" fill="#2dd4bf"/>
<text x="512" y="262" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">hermes-agent</text>
<rect x="714" y="244" width="60" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="744" y="258" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">procd</text>
<text x="512" y="296" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">Python 3.13 or 3.11</text>
<text x="512" y="318" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">193 MB installed</text>
<text x="512" y="340" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">175 MB RSS</text>

<!-- luci-app-hermes card -->
<rect x="492" y="372" width="296" height="108" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1"/>
<rect x="492" y="372" width="6" height="108" rx="3" ry="3" fill="#2dd4bf"/>
<text x="512" y="402" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">luci-app-hermes</text>
<rect x="706" y="384" width="68" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="740" y="398" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">web UI</text>
<text x="512" y="434" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">status, log, settings</text>
<text x="512" y="456" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">write-only keys</text>

<!-- left card: the model -->
<rect x="60" y="245" width="320" height="190" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="60" y="245" width="6" height="190" rx="3" ry="3" fill="#4493f8"/>
<text x="86" y="281" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">The model</text>
<rect x="276" y="259" width="90" height="22" rx="11" ry="11" fill="#141a23" stroke="#4493f8" stroke-width="1"/>
<text x="321" y="274" font-size="12.5" fill="#4493f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">elsewhere</text>
<line x1="86" y1="297" x2="354" y2="297" stroke="#222b38" stroke-width="1"/>
<text x="86" y="327" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">OpenAI, OpenRouter, Anthropic</text>
<text x="86" y="349" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">or llama-server on your LAN</text>
<text x="86" y="371" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">any OpenAI-compatible endpoint</text>

<!-- right card: the router itself -->
<rect x="900" y="245" width="320" height="190" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="900" y="245" width="6" height="190" rx="3" ry="3" fill="#3fb950"/>
<text x="926" y="281" font-size="20" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">The router itself</text>
<rect x="1154" y="259" width="52" height="22" rx="11" ry="11" fill="#141a23" stroke="#3fb950" stroke-width="1"/>
<text x="1180" y="274" font-size="12.5" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">ubus</text>
<line x1="926" y1="297" x2="1194" y2="297" stroke="#222b38" stroke-width="1"/>
<text x="926" y="327" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">openwrt-mcp, 9 tools</text>
<text x="926" y="349" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">policy-checked, audited</text>
<text x="926" y="371" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">rollback timer on changes</text>

<!-- bottom strip -->
<line x1="60" y1="560" x2="1220" y2="560" stroke="#222b38" stroke-width="1"/>
<text x="640" y="592" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">Not Docker. Not a chroot. An apk or ipk that installs into a private site-packages and runs under procd.</text>

<text x="1252" y="702" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/hermes-openwrt</text>
</svg>
