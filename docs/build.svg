<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
</defs>

<rect x="0" y="0" width="1280" height="400" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="400" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<!-- one continuous teal chain: visible in the four gaps, hidden under the cards -->
<line x1="45" y1="200" x2="1235" y2="200" stroke="#2dd4bf" stroke-width="2" opacity="0.7"/>
<path d="M 290 200 l -11 -6 l 0 12 z" fill="#2dd4bf"/>
<path d="M 535 200 l -11 -6 l 0 12 z" fill="#2dd4bf"/>
<path d="M 780 200 l -11 -6 l 0 12 z" fill="#2dd4bf"/>
<path d="M 1025 200 l -11 -6 l 0 12 z" fill="#2dd4bf"/>
<circle cx="45" cy="200" r="4" fill="#2dd4bf">
  <animate attributeName="cx" values="45;1235" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.95;1" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- card 1: upstream -->
<rect x="45" y="90" width="210" height="220" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="45" y="90" width="6" height="220" rx="3" ry="3" fill="#2dd4bf"/>
<rect x="195" y="104" width="46" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="218" y="118" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">MIT</text>
<text x="63" y="148" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">upstream</text>
<line x1="63" y1="164" x2="237" y2="164" stroke="#222b38" stroke-width="1"/>
<text x="63" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">NousResearch/</text>
<text x="63" y="200" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">hermes-agent</text>
<text x="63" y="220" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">69 Python packages</text>

<!-- card 2: build inside the target -->
<rect x="290" y="90" width="210" height="220" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="290" y="90" width="6" height="220" rx="3" ry="3" fill="#2dd4bf"/>
<rect x="416" y="104" width="70" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="451" y="118" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">docker</text>
<text x="308" y="148" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">build inside</text>
<text x="308" y="170" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">the target</text>
<line x1="308" y1="186" x2="482" y2="186" stroke="#222b38" stroke-width="1"/>
<text x="308" y="202" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">openwrt/rootfs for</text>
<text x="308" y="222" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">that release</text>
<text x="308" y="242" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">musllinux wheels,</text>
<text x="308" y="262" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">nothing compiled</text>
<text x="308" y="282" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">22 seconds</text>

<!-- card 3: one shim -->
<rect x="535" y="90" width="210" height="220" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="535" y="90" width="6" height="220" rx="3" ry="3" fill="#2dd4bf"/>
<rect x="629" y="104" width="102" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="680" y="118" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">webbrowser</text>
<text x="553" y="148" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">one shim</text>
<line x1="553" y1="164" x2="727" y2="164" stroke="#222b38" stroke-width="1"/>
<text x="553" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">OpenWrt ships no</text>
<text x="553" y="200" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">webbrowser</text>
<text x="553" y="220" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">open() returns False</text>

<!-- card 4: package -->
<rect x="780" y="90" width="210" height="220" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="780" y="90" width="6" height="220" rx="3" ry="3" fill="#2dd4bf"/>
<rect x="874" y="104" width="102" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="925" y="118" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">apk or ipk</text>
<text x="798" y="148" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">package</text>
<line x1="798" y1="164" x2="972" y2="164" stroke="#222b38" stroke-width="1"/>
<text x="798" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">apk mkpkg on 25.12</text>
<text x="798" y="200" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">gzipped tar on 24.10</text>

<!-- card 5: sign and publish -->
<rect x="1025" y="90" width="210" height="220" rx="8" ry="8" fill="#1b2331" stroke="#283341" stroke-width="1" filter="url(#soft)"/>
<rect x="1025" y="90" width="6" height="220" rx="3" ry="3" fill="#2dd4bf"/>
<rect x="1119" y="104" width="102" height="20" rx="10" ry="10" fill="#141a23" stroke="#2dd4bf" stroke-width="1"/>
<text x="1170" y="118" font-size="12.5" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">local only</text>
<text x="1043" y="148" font-size="18" font-weight="700" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="start">sign and publish</text>
<line x1="1043" y1="164" x2="1217" y2="164" stroke="#222b38" stroke-width="1"/>
<text x="1043" y="180" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">keys never leave the</text>
<text x="1043" y="200" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">workstation</text>
<text x="1043" y="220" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">GitHub Pages serves</text>
<text x="1043" y="240" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="start">the feed</text>

<text x="640" y="365" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">pip resolves wheels for the interpreter it runs under, so the tree is assembled inside the release it targets.</text>

<text x="1252" y="380" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/hermes-openwrt</text>
</svg>
