<svg xmlns="http://www.w3.org/2000/svg" width="760" height="900" viewBox="0 0 760 900" role="img" aria-label="The approval in Telegram: the card from the bot with Approve and Reject; Approve has the bot repeat the change and ask for the PIN and a code; your message with them is deleted at once; the bot answers Approved and applied, and the agent confirms">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e16"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#4493f8"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker>
</defs>
<rect width="760" height="900" fill="url(#bg)"/><rect width="760" height="900" fill="url(#grid)" opacity="0.5"/>
<rect width="760" height="4" fill="url(#accent)"/>
<style>.m{opacity:0;animation:show 12s ease-in-out infinite}@keyframes show{0%{opacity:0}4%,92%{opacity:1}97%,100%{opacity:0}}@keyframes gone{0%,60%{opacity:1}64%,100%{opacity:0}}.b0{animation-delay:0.00s}.b1{animation-delay:1.68s}.b2{animation-delay:3.60s}.b3{animation-delay:5.52s}.b4{animation-delay:7.20s}.b5{animation-delay:8.88s}.del{animation:gone 12s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.m{opacity:1;animation:none}.del{animation:none}}</style>
<rect x="0" y="4" width="760" height="896" fill="#0e1621"/>
<rect x="0" y="4" width="760" height="74" fill="#17212b"/>
<circle cx="52" cy="41" r="22" fill="#5288c1"/><text x="52" y="48" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" fill="#e6edf3" font-weight="600" text-anchor="middle">T</text>
<text x="88" y="37" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#e6edf3" font-weight="600">TestBot</text><text x="88" y="58" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#6d8296">bot</text>
<g class="m b0"><rect x="28" y="104" width="560" height="198" rx="14" fill="#182533"/><text x="42" y="129" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">Router change waiting for you (YWPYP, expires in 10 min)</text><text x="42" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">Asked by hermes-main:</text><text x="42" y="171" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">OPENS THE ROUTER TO THE INTERNET:</text><text x="42" y="192" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3">tcp 2224 from any address to 192.168.1.250:22</text><text x="42" y="213" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e6edf3"></text><text x="42" y="234" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">firewall.ssh_wan_2224, new redirect</text><text x="42" y="255" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">+ dest_ip '192.168.1.250'</text><text x="42" y="276" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#9aa7b8">+ src_dport '2224'  + target 'DNAT'</text><text x="576" y="293" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6d8296" text-anchor="end">22:52</text>
<rect x="28" y="308" width="277" height="40" rx="10" fill="#22303f"/><text x="166" y="334" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle">Approve</text>
<rect x="311" y="308" width="277" height="40" rx="10" fill="#22303f"/><text x="449" y="334" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3" text-anchor="middle">Reject</text>
</g>
<g class="m b1"><circle cx="166" cy="328" r="24" fill="none" stroke="#2dd4bf" stroke-width="2"/><text x="206" y="370" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf">you tap Approve</text></g>
<g class="m b2"><rect x="28" y="392" width="560" height="156" rx="14" fill="#182533"/><text x="42" y="417" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">To approve YWPYP, the change openwrt-mcp holds is:</text><text x="42" y="438" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">OPENS THE ROUTER TO THE INTERNET:</text><text x="42" y="459" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">tcp 2224 from any address to 192.168.1.250:22</text><text x="42" y="480" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3"></text><text x="42" y="501" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">If that is what you want, send your PIN and then</text><text x="42" y="522" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">the 6-digit code from your app, with a space between.</text><text x="576" y="539" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6d8296" text-anchor="end">22:52</text></g>
<g class="m b3"><rect x="28" y="564" width="300" height="84" rx="12" fill="#0f1520" stroke="#30363d"/><text x="44" y="588" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">authenticator app on your phone</text><text x="44" y="620" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#9aa7b8">Flint 2</text><text x="312" y="622" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="24" fill="#e6edf3" font-weight="600" text-anchor="end">503 917</text><text x="44" y="640" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#69788b">a new code every 30 s</text></g>
<g class="m b3"><g class="del"><rect x="532" y="582" width="200" height="54" rx="14" fill="#2b5278"/><text x="546" y="610" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16" fill="#e6edf3">4821 503917</text><text x="720" y="627" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6d8296" text-anchor="end">22:52 ✓✓</text></g>
<text x="732" y="658" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#2dd4bf" text-anchor="end">deleted at once, never shown to the model</text></g>
<g class="m b4"><rect x="28" y="682" width="300" height="53" rx="14" fill="#182533"/><text x="42" y="709" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" fill="#e6edf3">Approved and applied.</text><text x="316" y="726" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6d8296" text-anchor="end">22:52</text></g>
<g class="m b5"><rect x="28" y="749" width="560" height="72" rx="14" fill="#182533"/><text x="42" y="774" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">The port forward is in place. I read it back and</text><text x="42" y="795" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" fill="#e6edf3">confirmed it, so it will not roll back.</text><text x="576" y="812" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6d8296" text-anchor="end">22:53</text><text x="28" y="839" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" fill="#69788b">the agent, told the outcome in the same chat</text></g>
</svg>
