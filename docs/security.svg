<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0a0e16"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/>
    <stop offset="1" stop-color="#4493f8"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161b22" stroke-width="1"/>
  </pattern>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
  </filter>
  <marker id="arrowT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
  </marker>
  <marker id="arrowR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b63"/>
  </marker>
</defs>

<rect x="0" y="0" width="1280" height="520" fill="url(#bg)"/>
<rect x="0" y="0" width="1280" height="520" fill="url(#grid)" opacity="0.5"/>
<rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

<text x="640" y="62" font-size="24" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">A key goes in and does not come out</text>

<!-- The page -->
<g filter="url(#soft)">
  <rect x="60" y="140" width="330" height="150" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="60" y="140" width="6" height="150" rx="3" fill="#2dd4bf"/>
</g>
<text x="84" y="178" font-size="19" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">LuCI settings page</text>
<rect x="300" y="158" width="72" height="22" rx="11" fill="#141a23" stroke="#2dd4bf"/>
<text x="336" y="173" font-size="12" fill="#2dd4bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">browser</text>
<text x="84" y="224" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">API key field</text>
<text x="84" y="252" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">shows: stored</text>
<text x="84" y="276" font-size="15" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">never the value</text>

<!-- write, allowed -->
<line x1="400" y1="192" x2="656" y2="192" stroke="#3fb950" stroke-width="2.5" marker-end="url(#arrowT)"/>
<text x="528" y="180" font-size="15" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">set_secret</text>
<circle r="5" fill="#3fb950">
  <animateMotion dur="4s" repeatCount="indefinite" path="M 400 192 L 650 192"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4s" repeatCount="indefinite"/>
</circle>

<!-- read, refused. The X is drawn, not merely animated: the refusal must be legible
     in a still render, so the pulse only varies its opacity between 0.6 and 1. -->
<line x1="656" y1="252" x2="400" y2="252" stroke="#ff6b63" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowR)" opacity="0.75"/>
<text x="528" y="286" font-size="15" fill="#ff6b63" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">no method returns it</text>
<g stroke="#ff6b63" stroke-width="3.5" stroke-linecap="round">
  <line x1="516" y1="240" x2="540" y2="264"/>
  <line x1="540" y1="240" x2="516" y2="264"/>
  <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
</g>

<!-- The file -->
<g filter="url(#soft)">
  <rect x="656" y="140" width="330" height="150" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="656" y="140" width="6" height="150" rx="3" fill="#3fb950"/>
</g>
<text x="680" y="178" font-size="19" font-weight="600" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">on the router</text>
<rect x="882" y="158" width="86" height="22" rx="11" fill="#141a23" stroke="#3fb950"/>
<text x="925" y="173" font-size="12" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">0600 root</text>
<text x="680" y="224" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">/etc/hermes-agent/</text>
<text x="680" y="248" font-size="15" fill="#9aa7b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">provider.key</text>
<text x="680" y="276" font-size="15" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">not in UCI, not in argv</text>

<!-- no revocation -->
<g filter="url(#soft)">
  <rect x="1010" y="140" width="230" height="150" rx="8" fill="#1b2331" stroke="#283341"/>
  <rect x="1010" y="140" width="6" height="150" rx="3" fill="#e3b341"/>
</g>
<text x="1034" y="178" font-size="18" font-weight="600" fill="#e3b341" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">no revocation</text>
<text x="1034" y="218" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">a router that trusted</text>
<text x="1034" y="240" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">a feed key keeps</text>
<text x="1034" y="262" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">trusting it until the</text>
<text x="1034" y="284" font-size="14" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif">file is deleted by hand</text>

<line x1="60" y1="350" x2="1240" y2="350" stroke="#222b38" stroke-width="1"/>
<text x="640" y="386" font-size="16" fill="#e6edf3" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">The page can store a key and can ask whether one is present. Nothing returns one.</text>
<text x="640" y="414" font-size="15" fill="#9aa7b8" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">So a screenshot of the settings page cannot leak a key, and neither can a support bundle taken from the browser.</text>
<text x="640" y="442" font-size="15" fill="#69788b" font-family="ui-sans-serif, -apple-system, Segoe UI, sans-serif" text-anchor="middle">gate-luci.sh writes a canary through the RPC and requires that no readable method mentions it.</text>

<text x="1256" y="496" font-size="12" fill="#69788b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">github.com/TAIPANBOX/hermes-openwrt</text>
</svg>
